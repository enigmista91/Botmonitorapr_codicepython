name: Tests & Lint

on:
  push:
    branches: ["main", "master", "18.0", "19.0", "20.0"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run pytest
        run: |
          .venv/bin/pytest -v
